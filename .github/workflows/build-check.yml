name: Build check

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch photography
        run: bash Scripts/fetch_assets.sh
        continue-on-error: true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate content pack
        run: python3 Scripts/build_content.py

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Kneadly.xcodeproj \
            -scheme Kneadly \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO