name: Screenshots

# App Store screenshots on a 6.9" iPhone simulator. Run it from the Actions tab;
# download the "app-store-screenshots" artifact when it finishes.
on:
  workflow_dispatch:

jobs:
  shoot:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          python3 Scripts/build_content.py
          xcodegen generate

      - name: Pick a 6.9-inch simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for rt,v in d.items() if "iOS" in rt for x in v if "Pro Max" in x["name"]]
          c.sort(key=lambda x:x["name"])
          print(c[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project Kneadly.xcodeproj -scheme Kneadly -configuration Debug \
            -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO | tail -20

      - name: Shoot
        run: |
          APP=$(find dd/Build/Products -name "Kneadly.app" -maxdepth 3 | head -1)
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          n=1
          for s in today complete me routine player body paywall; do
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" -screenshot "$s"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/0${n}_${s}.png"
            n=$((n+1))
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: shots
